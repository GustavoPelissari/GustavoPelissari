name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0F2530&color_dots=#ebedf0,#b8efe3,#7fdcc9,#3fbfa6,#1f8c78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E8C88A&color_dots=#16313d,#1f5a58,#2f8f83,#4fbfa9,#5FD8C1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
